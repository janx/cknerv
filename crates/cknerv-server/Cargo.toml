[package]
name = "cknerv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum HTTP/WS server + Adapter trait for cknerv visualization"

[dependencies]
cknerv-core = { path = "../cknerv-core" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
# `raw_value` is what lets the delta rings hold already-serialized text and
# embed it verbatim in a frame — one serialization per delta instead of one
# per connected client. Feature only, so the workspace version pin stands.
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `connect` is what the smoke test needs: a real client handshake against the
# bound listener, so the reconnect arms in `ws.rs` are exercised through the
# router rather than called directly.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite.workspace = true
tower = "0.5"
