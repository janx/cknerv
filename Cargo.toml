[workspace]
resolver = "2"
members = [
    "crates/cknerv-core",
    "crates/cknerv-server",
    "crates/cknerv-adapter-ckb",
    "crates/cknerv-adapter-ckbadger",
    "crates/cknerv-cli",
]

[workspace.package]
version = "1.0.4"
edition = "2021"
license = "GPL-3.0"
authors = ["janx <janx@users.noreply.github.com>"]

[workspace.dependencies]
# Versions are pinned to match ckb-rcg/simulator's manifest (see B1.3 in
# the Phase B extraction plan). When simulator switches to consuming
# cknerv via [patch.crates-io] in B7, any drift here would trigger
# resolver conflicts — keep them in lockstep.
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
# Only the ckbadger adapter needs it today — the crawler is keyed by PeerId
# bytes and CKB's RPC prints them base58 — but a version belongs with the other
# cross-crate pins rather than alone in one manifest.
bs58 = { version = "0.5", default-features = false }
ckb-types = "1.1"
ckb-hash = "1.1"
ckb-jsonrpc-types = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["connect"] }
tracing = "0.1"
url = "2"

# Release ships one self-contained binary — the embedded dashboard bundle plus
# the adapter, projection, and server crates linked together — so cross-crate
# inlining and dead-code elimination have the whole program to work on. Measured
# on a cold 239-crate release build of `-p cknerv-cli`: 16.9s / 14_229_720 B
# stock, 35.1s / 14_081_736 B with thin LTO, 42.1s / 11_489_448 B with both.
# `codegen-units = 1` costing 7s for 2.5 MiB is not a trade worth declining; a
# release build is not the edit loop. Anyone who does feel it should reach for
# `CKNERV_SKIP_UI_BUILD=1` on a debug build instead of loosening this.
[profile.release]
lto = "thin"
codegen-units = 1
