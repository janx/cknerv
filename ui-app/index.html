<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>cknerv</title>
    <style>
      /* The background is HUD_COLORS.stageGround from
         packages/ui/src/components/hud/hudTheme.ts — the same value the Canvas
         wrapper and the scene's own clear read by name — spelled out here for
         the same reason the boot shell below spells its three: a stylesheet in
         the document head cannot import. It paints before any module has
         evaluated and holds the ground until a first frame exists, so a copy
         that drifts shows up as the page shifting at first light.
         `ui-app/__tests__/App.sceneRoots.test.tsx` holds this literal against
         the token. */
      body { margin: 0; background: #02030a; overflow: hidden; font-family: ui-monospace, monospace; color: #cbd5e1; }
      #root { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Boot shell. The bundle is a module script and the cells snapshot is
           several megabytes, so on an ordinary remote connection this markup is
           the only thing on screen for the first three seconds — measured, and
           previously three seconds of pure black. It sits INSIDE #root, so
           `root.render` replaces it atomically and no teardown code exists.
           Reads correctly with no JS at all: a visitor whose bundle never
           arrives is looking at INSTRUMENT, which is exactly true.
           Geometry and voice mirror StreamHealthBanner (edge-bound 30px band);
           the colours are HUD_COLORS.cyanWire / dim / danger from
           packages/ui/src/components/hud/hudTheme.ts, spelled out because
           index.html cannot import. No animation — text state only.

           THE FACES ARE THE BAND'S, and that is E2's fix. This markup drew
           STAGE POWER-ON in the OS monospace while the React band that
           replaces it sets the same words in Saira 700 over Share Tech Mono,
           with the ◇ in the JetBrains subset — so one word was set in three
           typefaces inside the first second (report E, E-2). The stacks below
           are HUD_FONTS.mono / .display and the diamond's, and `vite-boot-
           faces.ts` puts their `@font-face` and a preload in the head so the
           bytes are in flight with the document rather than after a
           `useEffect`. -->
      <div id="cknerv-boot-shell" data-boot-shell role="status" aria-live="polite"
           style="position:absolute;top:36px;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;font-family:'Share Tech Mono','JetBrains Mono Local',ui-monospace,monospace;font-size:10.5px;color:#20F0FF;background:linear-gradient(90deg,transparent,rgba(32,240,255,.13) 28%,rgba(0,0,0,.78) 50%,rgba(32,240,255,.13) 72%,transparent);border-bottom:1px solid rgba(32,240,255,.45)">
        <span aria-hidden="true" style="font-family:'JetBrains Mono Local',ui-monospace,monospace">◇</span>
        <span style="font-family:'Saira','JetBrains Mono Local',system-ui,sans-serif;font-weight:700;letter-spacing:2px">STAGE POWER-ON</span>
        <span id="cknerv-boot-shell-phase" style="font-size:9px;letter-spacing:1.2px">INSTRUMENT</span>
        <span id="cknerv-boot-shell-detail" style="font-size:9px;letter-spacing:1.2px;color:#7C8794"></span>
      </div>
    </div>
    <!-- The shell stands where the strip will, and the strip has two heights.
         `STATUS_STRIP_HEIGHTS` in packages/ui/src/components/hud/StatusStrip.tsx
         is the authority: 36 wide, 64 compact, 59 on a phone — and `HudOverlay`
         goes compact at 1280 and mobile at 560. The shell hard-coded 36, so
         every viewport at or under 1280 watched the band DROP 28px at the
         handover, in the same frames the band exists to hold still (report E,
         E-2). Classic and inline, right under the element: it has to run
         before the first paint and there is no module to wait for.
         `ui-app/__tests__/boot-shell.test.ts` holds these three literals
         against the token. -->
    <!-- …and it is the shell that shows a bootstrap fault, because a fault is
         the one moment the page has nothing else to show. This used to replace
         #root with a `<pre>` in `#f88` and the browser's own monospace — the
         designed band was told the phase it died in and then deleted in the
         same tick, so the one state a visitor with a dead server ever sees was
         the one state nobody had drawn (report E, E-7). The band stands; the
         line below it carries the whole message, wrapping, in the shell's own
         faces and the palette's `danger`.

         The hook lives HERE and not in `boot-shell.ts` for the reason the
         markup above lives here: the shell's colours and stacks cannot be
         imported, so they are spelled once, in one file. `main.tsx` calls it
         and knows nothing about how the shell looks. -->
    <script>
      (function () {
        var shell = document.getElementById('cknerv-boot-shell');
        if (!shell) return;
        if (typeof window.matchMedia === 'function') {
          shell.style.top = window.matchMedia('(max-width: 560px)').matches ? '59px'
            : window.matchMedia('(max-width: 1280px)').matches ? '64px'
            : '36px';
        }
        // Installed whatever the sizing above could work out: a page that
        // cannot answer a media query still has a fault to show.
        window.__cknervBootFault = function (text) {
          // The band may already be gone — React took #root — in which case
          // the HUD's own banner is holding the fault and this must not draw a
          // second one.
          if (!shell.isConnected) return false;
          var line = document.getElementById('cknerv-boot-shell-fault');
          if (!line) {
            line = document.createElement('div');
            line.id = 'cknerv-boot-shell-fault';
            line.setAttribute('role', 'alert');
            line.style.cssText = 'position:absolute;left:0;right:0;top:' +
              (parseInt(shell.style.top, 10) + 30) + 'px;padding:9px 16px;box-sizing:border-box;' +
              'text-align:center;font-size:9px;letter-spacing:1.2px;line-height:1.6;' +
              'white-space:pre-wrap;overflow-wrap:anywhere;color:#FF3030;' +
              "font-family:'Share Tech Mono','JetBrains Mono Local',ui-monospace,monospace";
            shell.parentNode.insertBefore(line, shell.nextSibling);
          }
          // `textContent`, so a hostile payload in a fault message cannot
          // smuggle markup into the one surface a broken page still renders.
          line.textContent = text;
          return true;
        };
      })();
    </script>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
