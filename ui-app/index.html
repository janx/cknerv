    <meta charset="UTF-8" />

    <meta property="og:description" content="Explore CKB as a living cell galaxy. Watch real blocks, transactions, cells, and peers in a local-first, read-only chain visualization." />

    <style>
      :root { color-scheme: dark; background:#02030a; }
      body { margin:0; overflow:hidden; background:#02030a; color:#7c8794; font-family:'Share Tech Mono','JetBrains Mono Local',ui-monospace,monospace; }
      #root { width:100vw; height:100vh; }
      #cknerv-startup { position:fixed; inset:0; z-index:10000; display:grid; place-items:center; box-sizing:border-box; padding:24px; overflow:hidden; background:#02030a; opacity:1; transition:opacity 400ms ease; }
      #cknerv-startup[data-state="leaving"] { opacity:0; pointer-events:none; }
      .cknerv-startup-aura { position:absolute; width:min(74vw,680px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(32,240,255,.11),rgba(32,240,255,.025) 34%,transparent 69%); animation:cknerv-breathe 4s ease-in-out infinite; }
      .cknerv-startup-grid { position:absolute; inset:0; opacity:.13; background-image:linear-gradient(rgba(32,240,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(32,240,255,.16) 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(circle at center,#000,transparent 72%); }
      .cknerv-startup-body { position:relative; width:min(460px,calc(100vw - 40px)); text-align:center; }
      .cknerv-startup-mark { width:104px; height:104px; margin:0 auto 25px; color:#20f0ff; filter:drop-shadow(0 0 18px rgba(32,240,255,.32)); animation:cknerv-breathe 4s ease-in-out infinite; }
      .cknerv-startup-word { margin:0; font-family:'Saira','JetBrains Mono Local',system-ui,sans-serif; font-size:clamp(30px,6vw,48px); font-weight:700; letter-spacing:.24em; text-indent:.24em; color:#C9F8FF; }
      .cknerv-startup-tagline { margin:7px 0 43px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#70808f; }
      .cknerv-startup-readout { height:180px; }
      #cknerv-startup-status { min-height:18px; color:#20f0ff; font-size:11px; letter-spacing:.16em; }
      #cknerv-startup-detail { height:30px; margin-top:8px; color:#7c8794; font-size:9px; line-height:1.55; letter-spacing:.1em; overflow:auto; overflow-wrap:anywhere; }
      .cknerv-startup-track { position:relative; height:1px; margin:12px auto 0; width:min(330px,78vw); overflow:hidden; background:rgba(124,135,148,.22); }
      #cknerv-startup-progress { position:absolute; inset:0; transform:scaleX(0); transform-origin:left; background:#20f0ff; transition:transform 120ms linear; }
      .cknerv-startup-track[data-indeterminate="true"]::after { content:""; position:absolute; inset:0; width:36%; background:linear-gradient(90deg,transparent,#20f0ff,transparent); animation:cknerv-scan 1.6s linear infinite; }
      #cknerv-startup-reload { margin-top:17px; padding:8px 18px; border:1px solid rgba(32,240,255,.55); background:rgba(2,3,10,.82); color:#C9F8FF; font:10px 'Share Tech Mono',ui-monospace,monospace; letter-spacing:.16em; cursor:pointer; }
      .cknerv-startup-diagnostics { margin:16px auto 0; width:min(380px,82vw); color:#7C8794; font-size:8px; line-height:1.55; letter-spacing:.08em; }
      .cknerv-startup-diagnostics summary { cursor:pointer; color:#7C8794; }
      #cknerv-startup-diagnostics { display:block; margin-top:6px; white-space:pre-wrap; overflow-wrap:anywhere; }
      #cknerv-startup[data-state="failed"] #cknerv-startup-status,#cknerv-startup[data-state="failed"] #cknerv-startup-detail { color:#FF3030; }
      #cknerv-startup[data-state="failed"] .cknerv-startup-mark,#cknerv-startup[data-state="failed"] .cknerv-startup-aura { color:#FF3030; animation:none; }
      @keyframes cknerv-breathe { 50% { opacity:.7; transform:scale(.975); } }
      @keyframes cknerv-scan { from { transform:translateX(-110%); } to { transform:translateX(320%); } }
      @media (prefers-reduced-motion:reduce) { .cknerv-startup-aura,.cknerv-startup-mark,.cknerv-startup-track::after { animation:none!important; } #cknerv-startup { transition:none; } }
      @media (max-width:390px) { #cknerv-startup { padding:18px; } .cknerv-startup-mark { width:78px; height:78px; margin-bottom:18px; } .cknerv-startup-tagline { margin-bottom:32px; } }
      @media (max-height:440px) and (orientation:landscape) { .cknerv-startup-mark { width:58px; height:58px; margin-bottom:10px; } .cknerv-startup-word { font-size:26px; } .cknerv-startup-tagline { margin:3px 0 16px; } }
    </style>
  </head>
  <body>
    <div id="root" inert></div>
    <div id="cknerv-startup" data-boot-shell data-state="preparing">
      <div class="cknerv-startup-grid" aria-hidden="true"></div>
      <div class="cknerv-startup-aura" aria-hidden="true"></div>
      <div class="cknerv-startup-body">
        <svg class="cknerv-startup-mark" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M60 7 113 60 60 113 7 60Z" fill="none" stroke="currentColor" stroke-width="1.25" opacity=".72"/>
          <path d="M60 20 100 60 60 100 20 60Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M60 35 85 60 60 85 35 60Z" fill="rgba(32,240,255,.035)" stroke="currentColor" stroke-width="1" opacity=".7"/>
          <circle cx="60" cy="60" r="3" fill="currentColor"/>
        </svg>
        <h1 class="cknerv-startup-word">CKNERV</h1>
        <p class="cknerv-startup-tagline">A visible body for CKB.</p>
        <div class="cknerv-startup-readout">
          <div id="cknerv-startup-status" role="status" aria-live="polite" aria-atomic="true">PREPARING CKNERV</div>
          <div id="cknerv-startup-detail"></div>
          <div class="cknerv-startup-track" aria-hidden="true"><div id="cknerv-startup-progress"></div></div>
          <div id="cknerv-startup-error" hidden></div>
          <button id="cknerv-startup-reload" type="button" hidden>RELOAD</button>
          <details class="cknerv-startup-diagnostics">
            <summary>DETAILS</summary>
            <span id="cknerv-startup-diagnostics">BUNDLE PENDING</span>
          </details>
        </div>
      </div>
    </div>
    <noscript><div style="position:fixed;inset:auto 16px 18px;z-index:10001;text-align:center;color:#FF3030;font:11px ui-monospace,monospace">CKNERV REQUIRES JAVASCRIPT TO RENDER THE LIVE VIEW.</div></noscript>
    <script>
      (function () {
        var shell=document.getElementById('cknerv-startup');
        var status=document.getElementById('cknerv-startup-status');
        var detail=document.getElementById('cknerv-startup-detail');
        var reload=document.getElementById('cknerv-startup-reload');
        var claimed=false;
        function waiting(){if(claimed||!shell)return;status.textContent='STILL PREPARING CKNERV';detail.textContent='THE APPLICATION IS TAKING LONGER THAN EXPECTED.';shell.dataset.state='waiting';}
        function reloadable(){if(claimed||!shell)return;waiting();reload.hidden=false;}
        var slow=setTimeout(waiting,8000), long=setTimeout(reloadable,30000);
        reload.addEventListener('click',function(){location.reload();});
        function stopEarlyWatch(){clearTimeout(slow);clearTimeout(long);window.removeEventListener('error',onScriptError,true);}
        function onScriptError(event){var target=event.target;if(target&&target.tagName==='SCRIPT'&&target.type==='module')window.__cknervBootFault('The application script could not be loaded.');}
        window.__cknervBootTakeover=function(){claimed=true;stopEarlyWatch();delete window.__cknervBootTakeover;};
        window.__cknervBootFault=function(text){if(!shell||!shell.isConnected)return false;claimed=true;clearTimeout(slow);clearTimeout(long);shell.dataset.state='failed';status.setAttribute('role','alert');status.textContent='UNABLE TO LOAD CKNERV';detail.textContent=String(text);reload.hidden=false;return true;};
        window.__cknervBootCleanup=function(){claimed=true;stopEarlyWatch();delete window.__cknervBootTakeover;delete window.__cknervBootFault;delete window.__cknervBootCleanup;};
        window.addEventListener('error',onScriptError,true);
      })();
    </script>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
